
spring.application.name=${APP_NAME:MindMate}

# Database (Railway)
spring.datasource.url=${DB_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.main.allow-bean-definition-overriding=true

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:assets/uploads/images/}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Qdrant (Cloud)
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6333}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:mindmate-memory}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}

# Server (Railway provides PORT)
server.port=${PORT:8080}

# CORS
spring.web.cors.allowed-origins=${CORS_ORIGINS:*}
spring.web.cors.allowed-methods=${CORS_METHODS:*}
spring.web.cors.allowed-headers=${CORS_HEADERS:*}

# Redis (Upstash)
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.ssl=${REDIS_SSL:true}